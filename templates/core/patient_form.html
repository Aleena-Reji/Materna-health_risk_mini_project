{% extends "core/base.html" %}

{% block title %}Add Patient - Materna{% endblock %}

{% block content %}
<h2>Add Patient</h2>

<form method="post" class="card-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save Patient</button>
    <a href="{% url 'patient_list' %}" class="btn-link">Cancel</a>
</form>
{% endblock %}
