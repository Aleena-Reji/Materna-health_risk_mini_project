{% extends "core/base.html" %}

{% block title %}Delete Visit - Materna{% endblock %}

{% block content %}
<h2>Delete visit</h2>

<form method="post" class="card-form">
    {% csrf_token %}
    <p>
        Are you sure you want to delete the visit on
        <strong>{{ visit.visit_date }}</strong> for
        <strong>{{ visit.patient.name }}</strong>?
    </p>
    <p class="muted">This cannot be undone.</p>
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'visit_detail' visit.pk %}" class="btn-link">Cancel</a>
</form>
{% endblock %}
