{% extends "core/base.html" %}

{% block title %}{{ title }} - Materna{% endblock %}

{% block content %}
<h2>{{ title }} for {{ patient.name }}</h2>

<form method="post" class="card-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save Visit</button>
    {% if form.instance.pk %}
        <a href="{% url 'visit_detail' form.instance.pk %}" class="btn-link">Cancel</a>
    {% else %}
        <a href="{% url 'patient_detail' patient.pk %}" class="btn-link">Cancel</a>
    {% endif %}
</form>
{% endblock %}
