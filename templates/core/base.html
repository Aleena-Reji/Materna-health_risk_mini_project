<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Materna{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #222;
        }
        header {
            background: #c2185b;
            color: white;
            padding: 16px 32px;
        }
        header h1 { margin: 0; font-size: 22px; }
        nav a {
            color: white;
            margin-right: 16px;
            text-decoration: none;
        }
        main {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #f0f0f0; }
        .btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 9px 18px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
}
.btn:hover { background: var(--primary-dark); }
.btn-link { margin-left: 12px; color: var(--muted); text-decoration: none; }

.card-form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    max-width: 480px;
}
.card-form p { margin: 0 0 16px; }
.card-form label { display: block; font-weight: 600; margin-bottom: 6px; }
.card-form input, .card-form select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
}
.card-form input:focus, .card-form select:focus {
    outline: 2px solid var(--primary);
    border-color: var(--primary);
}
.card-form textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
}
.card-form textarea:focus {
    outline: 2px solid var(--primary);
    border-color: var(--primary);
}
.muted { color: var(--muted); }
td a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }
td a:hover { text-decoration: underline; }

nav { display: flex; align-items: center; }
.who { color: rgba(255,255,255,0.7); margin-left: 20px; font-size: 14px; }
.logout-form { margin: 0 0 0 16px; }
.logout-form button {
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 14px;
}
.logout-form button:hover { background: rgba(255,255,255,0.15); }

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.search-form { display: flex; align-items: center; gap: 8px; }
.search-form input {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    width: 260px;
}
.btn-danger { background: #b91c1c; }
.btn-danger:hover { background: #991b1b; }
.danger { color: #b91c1c !important; }
td a.action { font-weight: 500; margin-right: 12px; }

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}
.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
}
.stat-number { font-size: 32px; font-weight: 700; color: var(--primary); }
.stat-label { color: var(--muted); font-size: 14px; margin-top: 4px; }
h3 { color: var(--primary-dark); margin-top: 28px; }

.detail-card { max-width: 640px; }
.detail-card p { line-height: 1.5; }
.messages { margin-bottom: 16px; }
.message {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 8px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #065f46;
}
.message.error {
    background: #fef2f2;
    border-color: #fecaca;
    color: #991b1b;
}
.errorlist {
    list-style: none;
    margin: 0 0 6px;
    padding: 0;
    color: #b91c1c;
    font-size: 14px;
}
.helptext { color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>Materna</h1>
                <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'patient_list' %}">Patients</a>
                {% if user.is_staff %}<a href="/admin/">Admin</a>{% endif %}
                <span class="who">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="logout-form">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
