{% extends "core/base.html" %}

{% block title %}Login - Materna{% endblock %}

{% block content %}
<div class="auth-wrap">
    <h2>Welcome back</h2>
    <p class="muted" style="text-align:center;">Log in to continue to Materna.</p>

    <form method="post" class="card-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Log in</button>
    </form>
</div>
{% endblock %}
