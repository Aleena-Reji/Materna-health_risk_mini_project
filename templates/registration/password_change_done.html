{% extends "core/base.html" %}

{% block title %}Password changed - Materna{% endblock %}

{% block content %}
<section class="panel confirm-card">
    <div class="icon" style="background:var(--low-bg);color:var(--low-ink);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2>Password updated</h2>
    <p>Your new password is ready to use the next time you log in.</p>
    <div class="form-actions"><a href="{% url 'dashboard' %}" class="btn">Back to dashboard</a></div>
</section>
{% endblock %}
